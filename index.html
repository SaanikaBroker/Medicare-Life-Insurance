
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrueNorth Medicare & Life Insurance</title>
    <meta name="description" content="Licensed insurance broker in San Antonio helping Texans with Medicare, Life Insurance, Obamacare / Marketplace Insurance, and Dental & Vision coverage." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'tn-primary': '#1A365D', // Calmer, dignified deep slate navy
              'tn-secondary': '#FFFFFF',
              'tn-accent': '#B83A24',   // Warm, grounded brick-red/terracotta
              'tn-gray': '#F8FAFC',    // Soft neutral off-white / light slate
              'tn-text': '#2D3748',    // Softer charcoal to prevent high-contrast eye fatigue
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            },
          }
        }
      }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "InsuranceAgency",
      "name": "TrueNorth Medicare & Life Insurance",
      "description": "A Life Insurance and Medicare Broker located in San Antonio, Texas, serving clients all across Texas.",
      "telephone": "+1-210-985-0877",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "San Antonio",
        "addressRegion": "TX",
        "addressCountry": "US"
      },
      "image": "https://picsum.photos/1200/630",
      "url": "https://medicaresanantoniotx.com",
      "priceRange": "$",
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday"
          ],
          "opens": "10:00",
          "closes": "18:00"
        }
      ]
    }
    </script>
